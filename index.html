<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Okta Auth JS - Redirect SPA</title>
  <link href="https://global.oktacdn.com/okta-signin-widget/7.49.0/css/okta-sign-in.min.css" type="text/css" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css">
  <script src="config.js" type="text/javascript"></script>
  <script src="app.js" type="text/javascript" defer></script>
</head>
<body>
  <div class="card">
    <div class="title">Okta Auth JS Simple Redirect App</div>
    <div class="subtitle">Your authenticated information</div>

    <div id="content-jwt"></div>

    <div id="login-actions">
      <button class="primary-btn" onclick="loginWithOkta();">Sign in with Okta</button>
      <button class="entra-btn" onclick="loginWithEntra();">Sign in with Entra ID</button>
    </div>

    <button class="logout-btn" onclick="logoutFromOkta();">Close Okta Session</button>
  </div>
</body>
</html>
